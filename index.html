<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Find Your First Flip</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<!--
  TRANCHI — CONTRACT FLIPPING QUIZ FUNNEL (DQ variant) · Nov 18 2026
  For Typeform Q6 = B ("less than $4,000 and limited credit").
  Typeform redirect:  https://tranchi.ai/flip?name={{first_name}}&email={{email}}&v=quiz
  DEV NOTES
   1. Deal cards on the results screen are SAMPLES. Wire them to the same live-deals
      endpoint /start uses (filter: state + deal type, sort by lowest price), and keep
      the "Sample. Addresses unlock inside" line. If the API fails, show the samples,
      NOT an empty "live count isn't available" box.
   2. Replace CHECKOUT_URL with the $1 Pro checkout. Email is passed through so we skip the email step.
   3. Events push to window.dataLayer: quiz_view, quiz_step, quiz_answer, quiz_complete, checkout_click
      (each carries variant + step). Hook these into the funnel dashboard.
-->
<style>
:root{--bg:#f5f3ee;--card:#fff;--navy:#16233f;--navy2:#1e2f54;--gold:#b8902f;--gold2:#e2bf5c;--ink:#1a1f2b;--muted:#5d6676;--line:#e6e1d6;--green:#16a34a;--red:#dc2626;--soft:#faf7f0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:14px 16px 110px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font-weight:800;letter-spacing:2px;color:var(--navy);font-size:15px}
.xp{display:flex;align-items:center;gap:6px;background:var(--navy);color:var(--gold2);font-weight:800;font-size:13px;padding:6px 12px;border-radius:20px;transition:transform .25s}
.xp.bump{transform:scale(1.15)}
.card{background:var(--card);border-radius:20px;box-shadow:0 10px 30px rgba(22,35,63,.08);overflow:hidden}
.head{background:var(--navy);background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:14px 14px;padding:20px}
.kicker{color:var(--gold2);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.head h1{color:#fff;font-size:24px;line-height:1.2;font-weight:800}
.bar{display:flex;gap:6px;padding:16px 20px 0}
.bar i{flex:1;height:5px;border-radius:5px;background:var(--line)}
.bar i.on{background:var(--gold)}
.body{padding:18px 20px 22px}
.sub{color:var(--muted);font-size:15px;line-height:1.5;margin-bottom:16px}
.opt{display:block;width:100%;text-align:left;background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;font:inherit;color:inherit;transition:border-color .15s,background .15s}
.opt b{display:block;font-size:16px;margin-bottom:2px}
.opt span{font-size:13px;color:var(--muted);line-height:1.4}
.opt.sel{border-color:var(--gold);background:#fdf6e3}
.opt.locked{opacity:.55;cursor:not-allowed;position:relative}
.opt.locked:after{content:"🔒 Full program";position:absolute;top:14px;right:14px;font-size:11px;font-weight:700;color:var(--muted)}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1px;padding:3px 7px;border-radius:6px;background:#fdecc8;color:#8a6516;margin-left:6px;vertical-align:middle}
select{width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);font:inherit;font-size:16px;background:var(--soft)}
.hint{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.4}
/* game */
.deal{border:2px solid var(--line);border-radius:16px;padding:16px;background:var(--soft);margin-bottom:14px}
.deal .t{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--gold);text-transform:uppercase}
.deal .c{font-size:13px;color:var(--muted);margin:2px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
.grid small{display:block;font-size:11px;color:var(--muted)}
.grid b{font-size:17px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn button{padding:16px;border-radius:14px;border:2px solid var(--line);background:#fff;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
.result{display:none;border-radius:14px;padding:14px;margin-top:12px;font-size:14px;line-height:1.5}
.result.ok{display:block;background:#ecfdf3;border:1px solid #bbf7d0}
.result.no{display:block;background:#fef2f2;border:1px solid #fecaca}
.result b{display:block;font-size:16px;margin-bottom:4px}
.math{font-family:ui-monospace,monospace;font-size:13px;background:#fff;border-radius:8px;padding:8px 10px;margin-top:8px;line-height:1.6}
/* scanning */
.scan{text-align:center;padding:30px 10px}
.ring{width:72px;height:72px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--gold);margin:0 auto 18px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lines p{color:var(--muted);font-size:14px;margin:6px 0;opacity:.25;transition:opacity .4s}
.lines p.on{opacity:1;color:var(--ink)}
.lines p.on:before{content:"✓ ";color:var(--green);font-weight:800}
/* results */
.badge{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#fdf6e3,#fff);border:2px solid var(--gold2);border-radius:16px;padding:14px;margin-bottom:16px}
.medal{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold));display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 56px}
.badge b{display:block;font-size:17px}
.badge span{font-size:13px;color:var(--muted)}
.sample{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;background:var(--soft)}
.sample b{font-size:15px}
.sample small{display:block;font-size:12px;color:var(--muted)}
.blur{filter:blur(5px);user-select:none}
.pill{font-size:11px;font-weight:800;color:#8a6516;background:#fdecc8;padding:4px 8px;border-radius:6px;white-space:nowrap}
.locked-row{opacity:.5}
.plan{margin:16px 0;padding:0;list-style:none}
.plan li{display:block;padding-left:22px;position:relative;font-size:14px;line-height:1.45;margin-bottom:10px}
.plan li:before{content:"✓";color:var(--green);font-weight:800;position:absolute;left:0}
.quote{border-left:3px solid var(--gold);background:var(--soft);border-radius:10px;padding:12px;font-size:14px;margin:14px 0}
.quote span{display:block;font-size:12px;color:var(--gold);font-weight:800;margin-top:6px}
.trust{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:700;text-align:center;margin-top:10px}
.trust b{display:block;color:var(--ink);font-size:14px}
/* footer */
.foot{position:fixed;left:0;right:0;bottom:0;background:rgba(245,243,238,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.foot .in{max-width:480px;margin:0 auto;display:flex;gap:10px}
.back{flex:0 0 54px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:20px;cursor:pointer}
.go{flex:1;border:none;border-radius:14px;padding:16px;font:inherit;font-weight:800;font-size:17px;color:#fff;background:linear-gradient(135deg,var(--gold2),var(--gold));cursor:pointer}
.go:disabled{opacity:.4;cursor:not-allowed}
.fine{text-align:center;font-size:12px;color:var(--muted);margin-top:6px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--navy);color:var(--gold2);font-weight:800;padding:10px 18px;border-radius:30px;font-size:14px;transition:transform .3s;z-index:9}
.toast.show{transform:translateX(-50%) translateY(0)}
.hide{display:none}
.lk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.lkc{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--soft);opacity:.85}
.lki{aspect-ratio:4/3;background-size:cover;background-position:center;filter:saturate(.8)}
.lkc b{display:block;font-size:14px;padding:6px 8px 0}
.lkc small{display:block;font-size:10px;color:var(--muted);padding:0 8px 8px;line-height:1.3}
.row2{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line,#e8e3d7);border-radius:12px;padding:14px 16px;margin-top:10px;font-size:15px}.row2 b{font-size:20px;font-weight:800}.row2.fee{border:2px dashed var(--gold,#c4a24c);background:transparent}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="app">
  <div class="top"><div class="logo">TRANCHI</div><div class="xp" id="xp">⚡ <span id="xpn">0</span> pts</div></div>
  <div class="card">
    <div class="head"><div class="kicker" id="kicker"></div><h1 id="title"></h1></div>
    <div class="bar" id="bar"></div>
    <div class="body" id="body"></div>
  </div>
</div>
<div class="foot" id="foot"><div class="in"><button class="back" id="back" aria-label="Back">←</button><button class="go" id="go">Continue</button></div><div class="fine" id="fine"></div></div>

<script>
var CHECKOUT_URL = '#checkout'; // ← $1 Pro checkout
var q = new URLSearchParams(location.search);
var NAME = (q.get('name')||'').replace(/[^a-zA-Z' -]/g,'').trim().slice(0,20);
var VARIANT = q.get('v')||'quiz';
var S = {step:0, pts:0, state:'', type:'', goal:'', r1:null, r2:null};
var STATES = ['Alabama','Arizona','Arkansas','Florida','Georgia','Illinois','Indiana','Kentucky','Louisiana','Michigan','Mississippi','Missouri','North Carolina','Ohio','Oklahoma','Pennsylvania','South Carolina','Tennessee','Texas','Virginia','Wisconsin'];
var TOTAL = 6;
window.dataLayer = window.dataLayer||[];
function track(e,d){ try{ window.dataLayer.push(Object.assign({event:e,variant:VARIANT,step:S.step},d||{})); }catch(x){} }

function $(id){return document.getElementById(id)}
function addPts(n,msg){ S.pts+=n; $('xpn').textContent=S.pts; var x=$('xp'); x.classList.add('bump'); setTimeout(function(){x.classList.remove('bump')},250); if(msg){var t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){t.classList.remove('show')},1400);} }
function bar(){ var h=''; for(var i=1;i<=TOTAL;i++) h+='<i class="'+(i<=S.step?'on':'')+'"></i>'; $('bar').innerHTML=h; }
function head(k,t){ $('kicker').textContent=k; $('title').innerHTML=t; }
function foot(label,enabled,fine,showBack){ $('go').textContent=label; $('go').disabled=!enabled; $('fine').textContent=fine||''; $('back').style.display=showBack===false?'none':''; $('foot').classList.remove('hide'); }
function opts(list,key,onPick){
  return list.map(function(o){ return '<button class="opt'+(o.locked?' locked':'')+(S[key]===o.v?' sel':'')+'" data-v="'+o.v+'"'+(o.locked?' disabled':'')+'><b>'+o.b+(o.tag?'<span class="tag">'+o.tag+'</span>':'')+'</b><span>'+o.s+'</span></button>'; }).join('');
}
function bindOpts(key,pts,msg){
  [].forEach.call(document.querySelectorAll('.opt:not(.locked)'),function(el){
    el.onclick=function(){ var first=!S[key]; S[key]=el.getAttribute('data-v'); [].forEach.call(document.querySelectorAll('.opt'),function(o){o.classList.remove('sel')}); el.classList.add('sel'); $('go').disabled=false; if(first) addPts(pts,msg); track('quiz_answer',{q:key,a:S[key]}); };
  });
}
var money=function(n){return '$'+n.toLocaleString()};

var screens = [
  // 0 intro
  function(){
    head('🔓 '+(NAME?NAME+', you':'You')+' unlocked AI Contract Flipping', 'Play the game. Flip your first contract for <span style="color:var(--gold2)">$10K+</span>');
    $('body').innerHTML='<p class="sub">This is the same game we play on every deal: spot the stuck seller, run the numbers, flip the contract to a cash buyer. No money, no credit, no buying the house. You don\'t need the $4,000 program to start.</p>'+
      '<p class="sub" style="margin-top:10px">⭐ Caleb, 16, flipped his first contract for <b>$15K in 3 weeks</b>.</p>'+
      '<ul class="plan"><li>Pick your market and deal type</li><li>Spot 2 real-style deals: flip or flop?</li><li>Get your Flipper Score + matching deals</li></ul>';
    foot("Let's play →",true,'Takes about 60 seconds',false);
  },
  // 1 state
  function(){
    head('Step 1 of 6 · Your market','Where do you want to flip?');
    $('body').innerHTML='<p class="sub">Pick a state. Tranchi searches it for listings with motivated sellers.</p><select id="st"><option value="">Choose a state</option>'+STATES.map(function(s){return '<option'+(S.state===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select><p class="hint">Pro covers 1 market. The full program unlocks unlimited markets.</p>';
    $('st').onchange=function(){ var first=!S.state; S.state=this.value; $('go').disabled=!S.state; if(first&&S.state) addPts(10,'+10 · Market locked in'); track('quiz_answer',{q:'state',a:S.state}); };
    foot('Continue',!!S.state);
  },
  // 2 deal type
  function(){
    head('Step 2 of 6 · Your deal type','Which deals will you flip?');
    $('body').innerHTML='<p class="sub">These 3 are where motivated sellers hide in plain sight, and they\'re all in Tranchi Pro.</p>'+
      opts([
        {v:'stale',b:'Stale listings',tag:'BEST FOR BEGINNERS',s:'On the market 60+ days. The seller is tired and open to a lower offer.'},
        {v:'expired',b:'Expired listings',s:'Listed, never sold, now off the market. The seller still wants out.'},
        {v:'fsbo',b:'For sale by owner',s:'No agent in the way. You talk straight to the seller.'},
        {v:'x1',b:'Pre-foreclosures',s:'Owners behind on payments.',locked:true},
        {v:'x2',b:'Tax deeds & gov-seized',s:'Auction deals at deep discounts.',locked:true}
      ],'type');
    bindOpts('type',15,'+15 · Smart pick');
    foot('Continue',!!S.type);
  },
  // 3 goal
  function(){
    head('Step 3 of 6 · Your goal','How much do you want to make in your first 30 days?');
    $('body').innerHTML='<p class="sub">Using Tranchi Pro to flip your first contract. Pick your goal.</p>'+
      opts([
        {v:'5k',b:'💵 $5,000',s:'A first win. Prove to myself this works.'},
        {v:'10k',b:'💰 $10,000',s:'Real breathing room. Pay off debt and get ahead.'},
        {v:'20k',b:'🚀 $20,000+',s:'I want to flip a commercial or luxury deal.'}
      ],'goal');
    bindOpts('goal',10,'+10 · Goal set');
    foot('Continue',!!S.goal);
  },
  // 4 game round 1 (a flip)
  function(){ game(1,{type:'Expired listing',city:(S.state||'Ohio')+' · 3 bd / 1.5 ba',ask:78000,arv:150000,rep:12000,dom:'Listed 147 days, then expired'}); },
  // 5 game round 2 (a flop)
  function(){ game(2,{type:'Stale listing',city:(S.state||'Ohio')+' · 3 bd / 2 ba',ask:205000,arv:220000,rep:30000,dom:'94 days on market'}); },
  // 6 scanning
  function(){
    head('Scanning…','Finding flips in '+(S.state||'your state'));
    $('foot').classList.add('hide');
    var label={stale:'stale listings',expired:'expired listings',fsbo:'FSBO homes'}[S.type]||'listings';
    $('body').innerHTML='<div class="scan"><div class="ring"></div><div class="lines"><p>Scanning '+label+' in '+(S.state||'your state')+'</p><p>Checking days on market & price drops</p><p>Running the 70% rule on each one</p><p>Ranking by flip potential</p></div></div>';
    var ps=document.querySelectorAll('.lines p'),i=0;
    var t=setInterval(function(){ if(i<ps.length){ps[i].classList.add('on');i++;} else {clearInterval(t); S.step=7; render();} },650);
  },
  // 7 results
  function(){
    var score = S.pts, lvl = score>=85?'Natural Flipper':score>=60?'Flipper in Training':'Rookie Flipper';
    var label={stale:'Stale listings',expired:'Expired listings',fsbo:'FSBO'}[S.type]||'Listings';
    head('Your results','Your Flip Plan is ready');
    track('quiz_complete',{score:score,type:S.type,state:S.state,goal:S.goal});
    $('body').innerHTML=
      '<div class="badge"><div class="medal">🏅</div><div><b>'+lvl+' · '+score+' pts</b><span>You got '+((S.r1?1:0)+(S.r2?1:0))+'/2 deals right. '+(S.r1&&S.r2?'You\'ve got the eye.':'Tranchi runs this math for you on every deal.')+'</span></div></div>'+
      '<div class="kicker" style="color:var(--gold)">'+label+' in '+S.state+'</div>'+
      SAMPLES[S.type].map(function(x){return sample(x[0],x[1],x[2],true)}).join('')+
      '<div class="kicker" style="color:var(--gold);margin-top:14px">🔒 Full members see these too</div><div class="lk">'+
      [['philly','Tax sale','$1,600','Philadelphia, PA'],['parma','Tax deed','$18,537','Parma, OH'],['peoria','Pre-foreclosure','$13,650','Peoria, IL']].map(function(d){return '<div class="lkc"><div class="lki" style="background-image:url(tranchi-deal-photos/'+d[0]+'.jpg)"></div><b>'+d[2]+'</b><small>'+d[1]+'<br>'+d[3]+'</small></div>'}).join('')+'</div>'+
      '<p class="hint" style="margin-top:4px">Top 3 are examples. Locked deals are real ones found this week. Addresses unlock in your account.</p>'+
      '<ul class="plan"><li><b>10 '+label.toLowerCase()+' a month</b> picked by the AI</li><li>AI runs the numbers in 15 seconds, the same math you just did</li><li><b>1 AI-written offer a day</b> sent to sellers</li><li>Land your first flip, then upgrade. Your Pro payments count toward it</li></ul>'+
      '<div class="quote">"Placed 30-40 offers a week, got one accepted at $80K and flipped it for $95K. $15K in 3 weeks."<span>Caleb · 16 · no money down</span></div>'+
      '<div class="trust"><div><b>4.6★</b>Google</div><div><b>A+</b>BBB</div><div><b>$2B</b>Fund</div><div><b>Forbes</b>Featured</div></div>';
    foot('Start flipping for $1 →',true,'Then $97/month · Cancel anytime',false);
  }
];

var SAMPLES={stale:[['112 days · price cut twice','$84,900','3 bd'],['96 days · price cut','$71,500','2 bd'],['143 days on market','$96,000','3 bd']],expired:[['Expired after 180 days','$79,900','3 bd'],['Expired · never relisted','$64,000','2 bd'],['Expired after 121 days','$92,500','3 bd']],fsbo:[['FSBO · motivated seller','$88,000','3 bd'],['FSBO · price reduced','$69,900','2 bd'],['FSBO · vacant','$97,500','3 bd']]};
function sample(t,p,bd,blur){ return '<div class="sample"><div><b class="'+(blur?'blur':'')+'">1234 Oak St</b><small>'+t+' · '+bd+'</small></div><b>'+p+'</b></div>'; }

function game(n,d){
  var buyerMax=Math.round(d.arv*0.7-d.rep), spread=buyerMax-d.ask, isFlip=spread>=5000;
  head('Step '+(3+n)+' of 6 · Flip or flop? (round '+n+'/2)', n===1?'Is there money in this deal?':'What about this one?');
  $('body').innerHTML=
    (n===1?'<p class="sub">You lock the house at the <b>seller\'s price</b>, then sell the contract to a <b>cash buyer</b>. If the buyer pays more, <b>you keep the difference</b>.</p>':'<p class="sub">Same game. Does the buyer pay <b>more</b> than the seller wants?</p>')+
    '<div class="deal"><div class="t">'+d.type+'</div><div class="c">'+d.city+' · '+d.dom+'</div>'+
    '<div class="row2"><span>🏠 Seller wants</span><b>'+money(d.ask)+'</b></div>'+
    '<div class="row2"><span>💰 Cash buyer pays</span><b>'+money(buyerMax)+'</b></div>'+
    '<div class="row2 fee"><span>🤑 Your fee</span><b>?</b></div></div>'+
    '<div class="yn" id="yn"><button data-a="1">✅ Flip it</button><button data-a="0">❌ Pass</button></div><div class="result" id="res"></div>';
  foot('Next deal →',false);
  if(n===2) $('go').textContent='See my results →';
  [].forEach.call(document.querySelectorAll('#yn button'),function(b){
    b.onclick=function(){
      var ans=b.getAttribute('data-a')==='1', right=(ans===isFlip);
      S['r'+n]=right; track('quiz_answer',{q:'round'+n,a:ans?'flip':'pass',correct:right});
      [].forEach.call(document.querySelectorAll('#yn button'),function(x){x.disabled=true;x.style.opacity=x===b?1:.4});
      var r=$('res'); r.className='result '+(right?'ok':'no');
      r.innerHTML='<b>'+(right?'Correct! ':'Not quite. ')+(isFlip?'This one\'s a flip. 🎉':'This one\'s a flop.')+'</b>'+
        (isFlip?'The buyer pays more than the seller wants. That gap is yours: <strong>'+money(spread)+'</strong> without ever buying the house.':'The seller wants more than the buyer will pay. No gap means no fee, so you pass and find the next one.')+
        '<div class="math">'+money(buyerMax)+' − '+money(d.ask)+' = '+(spread>=0?money(spread):'−'+money(-spread))+'</div>'+
        '<p class="hint" style="margin-top:8px">Tranchi\'s AI figures out what cash buyers will pay on every deal, so you don\'t have to.</p>';
      if(right) addPts(n===1?30:35, n===1?'+30 · Flipper instinct!':'+35 · You read the math!'); else addPts(5,'+5 · Lesson learned');
      $('go').disabled=false;
    };
  });
}

function render(){ bar(); screens[S.step](); track('quiz_step'); window.scrollTo(0,0); }
$('go').onclick=function(){
  if(S.step===7){ track('checkout_click',{score:S.pts}); var u=CHECKOUT_URL+(CHECKOUT_URL.indexOf('?')>-1?'&':'?')+'state='+encodeURIComponent(S.state)+'&deal_type='+S.type+(q.get('email')?'&email='+encodeURIComponent(q.get('email')):''); location.href=u; return; }
  S.step++; render();
};
$('back').onclick=function(){ if(S.step>0 && S.step<6){ S.step--; render(); } };
track('quiz_view'); render();
</script>
</body>
</html>
